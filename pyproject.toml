[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "paretolab-finite"
version = "0.1.0"
description = "Exact bounded multiobjective DAG planning and independent evidence replay"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
paretolab = "paretolab.__main__:main"
[tool.setuptools]
packages = ["paretolab"]
